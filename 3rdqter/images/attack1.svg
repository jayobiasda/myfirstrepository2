<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fist -->
  <ellipse cx="50" cy="40" rx="22" ry="25" fill="#D4A574"/>
  <!-- Thumb -->
  <ellipse cx="28" cy="35" rx="8" ry="12" fill="#D4A574"/>
  <!-- Fingers -->
  <rect x="40" y="12" width="7" height="18" rx="3" fill="#D4A574"/>
  <rect x="50" y="10" width="7" height="20" rx="3" fill="#D4A574"/>
  <rect x="60" y="12" width="7" height="18" rx="3" fill="#D4A574"/>
  <!-- Wrist -->
  <rect x="38" y="60" width="24" height="20" rx="3" fill="#8B5A3C"/>
  <!-- Impact lines -->
  <line x1="15" y1="30" x2="5" y2="15" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="0" y2="50" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="65" x2="10" y2="80" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <!-- Star burst -->
  <circle cx="70" cy="25" r="12" fill="none" stroke="#FFD700" stroke-width="2"/>
  <line x1="70" y1="13" x2="70" y2="5" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="37" x2="70" y2="45" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="25" x2="90" y2="25" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="25" x2="50" y2="25" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
</svg>