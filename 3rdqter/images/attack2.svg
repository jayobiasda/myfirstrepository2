<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Explosion bursts -->
  <circle cx="50" cy="50" r="18" fill="#FF6B35"/>
  <circle cx="50" cy="50" r="12" fill="#FFD700"/>
  <circle cx="50" cy="50" r="6" fill="#FFF"/>
  <!-- Large spikes -->
  <polygon points="50,15 58,35 42,35" fill="#FF6B35"/>
  <polygon points="85,50 65,58 65,42" fill="#FF6B35"/>
  <polygon points="50,85 42,65 58,65" fill="#FF6B35"/>
  <polygon points="15,50 35,42 35,58" fill="#FF6B35"/>
  <!-- Medium spikes -->
  <polygon points="70,28 76,40 64,40" fill="#FFD700"/>
  <polygon points="72,72 64,60 76,60" fill="#FFD700"/>
  <polygon points="28,72 24,60 36,60" fill="#FFD700"/>
  <polygon points="30,28 36,40 24,40" fill="#FFD700"/>
  <!-- Shock waves -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FF6B35" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.7"/>
</svg>